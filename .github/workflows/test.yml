name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency: # A new push to the same PR cancels its older run.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bundle exec fastlane test
